name: Unified Terraform Pipeline

on:
  workflow_call:
    inputs:
      cloud_provider:
        description: "Target cloud provider (gcp | aws | azure)"
        required: true
        type: string
      terraform_version:
        description: "Terraform version to use"
        required: false
        type: string
        default: "1.10.5"
      environment:
        description: "Fallback environment if not detected from PR/commit"
        required: false
        type: string
        default: "dev"
      working_directory:
        description: "Fallback stack directory if not detected from PR/commit"
        required: false
        type: string
        default: "."
      state_bucket:
        description: "Optional state bucket override (e.g. my-org-tfstate-dev)"
        required: false
        type: string
        default: ""
      enable_security_scans:
        description: "Run Gitleaks, Trivy, Checkov, and TFLint on PRs"
        required: false
        type: boolean
        default: true
      fail_on_security_issues:
        description: "Fail CI if security scanners detect HIGH/CRITICAL issues"
        required: false
        type: boolean
        default: false
      templates_repository:
        description: "Centralized templates repository (owner/repo)"
        required: false
        type: string
        default: "yuva-cloud-devops/terraform-github-actions-templates"
      templates_ref:
        description: "Branch, tag or SHA of templates repository"
        required: false
        type: string
        default: "main"
    secrets:
      GCP_WIF_PROVIDER:
        required: false
      GCP_SERVICE_ACCOUNT:
        required: false
      AWS_ROLE_ARN:
        required: false
      AWS_REGION:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false
      BOT_GITHUB_TOKEN:
        required: false

concurrency:
  group: tf-pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ===================================================================
  # COMMON STEP 1: Parse PR / Commit Metadata
  # ===================================================================
  parse-pr-metadata:
    name: Step 1 - Parse PR & Config Metadata
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.parse.outputs.target_env }}
      config_file: ${{ steps.parse.outputs.config_file }}
      stacks: ${{ steps.parse.outputs.changed_stacks }}
      skip_ci: ${{ steps.parse.outputs.skip_ci }}
    steps:
      - name: Checkout Consumer Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Checkout Centralized Templates
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.templates_repository }}
          ref: ${{ inputs.templates_ref }}
          path: .github-templates
          fetch-depth: 1

      - name: Run Parse PR Metadata
        id: parse
        uses: ./.github-templates/pipelines/continuous-integration/parse-pr-metadata
        with:
          default_env: ${{ inputs.environment }}
          working_dir: ${{ inputs.working_directory }}

  # ===================================================================
  # COMMON STEP 2: Validate Config YAML & JSON Schema
  # ===================================================================
  validate-schema:
    name: Step 2 - Validate Config & Schema
    needs: [parse-pr-metadata]
    if: needs.parse-pr-metadata.outputs.skip_ci != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Consumer Code
        uses: actions/checkout@v6

      - name: Checkout Centralized Templates
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.templates_repository }}
          ref: ${{ inputs.templates_ref }}
          path: .github-templates
          fetch-depth: 1

      - name: Run Validate Schema
        uses: ./.github-templates/pipelines/continuous-integration/validate-schema
        with:
          schema_path: .github-templates/schemas/deployment-request-schema.json
          env_file: environments/${{ needs.parse-pr-metadata.outputs.env }}.yaml
          cloud_provider: ${{ inputs.cloud_provider }}
          target_env: ${{ needs.parse-pr-metadata.outputs.env }}
          config_file: ${{ needs.parse-pr-metadata.outputs.config_file }}
          changed_stacks: ${{ needs.parse-pr-metadata.outputs.stacks }}

  # ===================================================================
  # CI STAGE 3 (PR): Parallel Security Scans
  # ===================================================================
  gitleaks-scan:
    name: CI - Gitleaks Secret Scan
    needs: [parse-pr-metadata, validate-schema]
    if: github.event_name == 'pull_request' && inputs.enable_security_scans && needs.parse-pr-metadata.outputs.skip_ci != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.templates_repository }}
          ref: ${{ inputs.templates_ref }}
          path: .github-templates
          fetch-depth: 1
      - uses: ./.github-templates/pipelines/continuous-integration/security-scan
        with:
          tool: "gitleaks"
          github_token: ${{ secrets.BOT_GITHUB_TOKEN || github.token }}
          fail_on_issues: ${{ inputs.fail_on_security_issues }}
      - name: Upload Gitleaks Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: security-reports/gitleaks_report.txt
          retention-days: 7
          if-no-files-found: ignore

  trivy-scan:
    name: CI - Trivy Vulnerability Scan
    needs: [parse-pr-metadata, validate-schema]
    if: github.event_name == 'pull_request' && inputs.enable_security_scans && needs.parse-pr-metadata.outputs.skip_ci != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.templates_repository }}
          ref: ${{ inputs.templates_ref }}
          path: .github-templates
          fetch-depth: 1
      - uses: ./.github-templates/pipelines/continuous-integration/security-scan
        with:
          tool: "trivy"
          github_token: ${{ secrets.BOT_GITHUB_TOKEN || github.token }}
          fail_on_issues: ${{ inputs.fail_on_security_issues }}
      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: security-reports/trivy_report.txt
          retention-days: 7
          if-no-files-found: ignore

  tflint-check:
    name: CI - TFLint Check
    needs: [parse-pr-metadata, validate-schema]
    if: github.event_name == 'pull_request' && inputs.enable_security_scans && needs.parse-pr-metadata.outputs.skip_ci != 'true' && needs.parse-pr-metadata.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.templates_repository }}
          ref: ${{ inputs.templates_ref }}
          path: .github-templates
          fetch-depth: 1
      - uses: ./.github-templates/pipelines/continuous-integration/security-scan
        with:
          tool: "tflint"
          stacks: ${{ needs.parse-pr-metadata.outputs.stacks }}
          working_directory: ${{ inputs.working_directory }}
          github_token: ${{ secrets.BOT_GITHUB_TOKEN || github.token }}
          fail_on_issues: ${{ inputs.fail_on_security_issues }}

  checkov-scan:
    name: CI - Checkov Policy Scan
    needs: [parse-pr-metadata, validate-schema]
    if: github.event_name == 'pull_request' && inputs.enable_security_scans && needs.parse-pr-metadata.outputs.skip_ci != 'true' && needs.parse-pr-metadata.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.templates_repository }}
          ref: ${{ inputs.templates_ref }}
          path: .github-templates
          fetch-depth: 1
      - uses: ./.github-templates/pipelines/continuous-integration/security-scan
        with:
          tool: "checkov"
          stacks: ${{ needs.parse-pr-metadata.outputs.stacks }}
          working_directory: ${{ inputs.working_directory }}
          github_token: ${{ secrets.BOT_GITHUB_TOKEN || github.token }}
          fail_on_issues: ${{ inputs.fail_on_security_issues }}
      - name: Upload Checkov Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkov-report
          path: security-reports/checkov_report.txt
          retention-days: 7
          if-no-files-found: ignore

  # ===================================================================
  # CI STAGE 4 (PR): Terraform Format Check (Sequential)
  # ===================================================================
  terraform-fmt:
    name: CI - Terraform Format Check
    needs: [parse-pr-metadata, validate-schema, gitleaks-scan, trivy-scan, tflint-check, checkov-scan]
    if: >-
      always()
      && github.event_name == 'pull_request'
      && needs.parse-pr-metadata.outputs.skip_ci != 'true'
      && needs.parse-pr-metadata.outputs.stacks != '[]'
      && needs.validate-schema.result == 'success'
      && (needs.gitleaks-scan.result == 'success' || needs.gitleaks-scan.result == 'skipped')
      && (needs.trivy-scan.result == 'success' || needs.trivy-scan.result == 'skipped')
      && (needs.tflint-check.result == 'success' || needs.tflint-check.result == 'skipped')
      && (needs.checkov-scan.result == 'success' || needs.checkov-scan.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false
      - name: Check Terraform Formatting
        env:
          STACKS_JSON: ${{ needs.parse-pr-metadata.outputs.stacks }}
        run: |
          for dir in $(echo "$STACKS_JSON" | jq -r '.[]'); do
            echo "Checking format in $dir..."
            terraform -chdir="$dir" fmt -check -recursive
          done

  # ===================================================================
  # CI STAGE 5 (PR): Terraform Validate (Sequential)
  # ===================================================================
  terraform-validate:
    name: CI - Terraform Validate
    needs: [parse-pr-metadata, terraform-fmt]
    if: github.event_name == 'pull_request' && needs.parse-pr-metadata.outputs.skip_ci != 'true' && needs.parse-pr-metadata.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false
      - name: Init (No Backend) & Validate
        env:
          STACKS_JSON: ${{ needs.parse-pr-metadata.outputs.stacks }}
        run: |
          for dir in $(echo "$STACKS_JSON" | jq -r '.[]'); do
            echo "Validating $dir..."
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate -no-color
          done

  # ===================================================================
  # CI STAGE 6 (PR): Terraform Init (backend.hcl) & Plan (Sequential)
  # ===================================================================
  terraform-plan:
    name: CI - Terraform Plan
    needs: [parse-pr-metadata, terraform-validate]
    if: github.event_name == 'pull_request' && needs.parse-pr-metadata.outputs.skip_ci != 'true' && needs.parse-pr-metadata.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.templates_repository }}
          ref: ${{ inputs.templates_ref }}
          path: .github-templates
          fetch-depth: 1

      - name: GCP Auth
        if: inputs.cloud_provider == 'gcp'
        uses: ./.github-templates/pipelines/common/auth/gcp
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: AWS Auth
        if: inputs.cloud_provider == 'aws'
        uses: ./.github-templates/pipelines/common/auth/aws
        with:
          role_to_assume: ${{ secrets.AWS_ROLE_ARN }}
          aws_region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Azure Auth
        if: inputs.cloud_provider == 'azure'
        uses: ./.github-templates/pipelines/common/auth/azure
        with:
          client_id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Run Terraform Plan
        id: tf_plan
        uses: ./.github-templates/pipelines/continuous-integration/terraform-plan
        with:
          cloud_provider: ${{ inputs.cloud_provider }}
          environment: ${{ needs.parse-pr-metadata.outputs.env }}
          stacks: ${{ needs.parse-pr-metadata.outputs.stacks }}
          working_directory: ${{ inputs.working_directory }}
          config_file: ${{ needs.parse-pr-metadata.outputs.config_file }}
          state_bucket: ${{ inputs.state_bucket }}
          skip_fmt_validate: "true"

      - name: Upload Plan Outputs Artifact
        if: always() && steps.tf_plan.outputs.report_path != ''
        uses: actions/upload-artifact@v7
        with:
          name: plan-outputs
          path: ${{ steps.tf_plan.outputs.report_path }}
          retention-days: 14
          if-no-files-found: ignore

  # ===================================================================
  # CI STAGE 7 (PR): Post Consolidated PR Plan & Compliance Comment
  # ===================================================================
  pr-bot-comment:
    name: CI - Post Plan & Audit Comment
    needs: [parse-pr-metadata, validate-schema, gitleaks-scan, trivy-scan, checkov-scan, terraform-plan]
    if: always() && github.event_name == 'pull_request' && needs.parse-pr-metadata.outputs.skip_ci != 'true' && needs.validate-schema.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.templates_repository }}
          ref: ${{ inputs.templates_ref }}
          path: .github-templates
          fetch-depth: 1

      - name: Download Security & Plan Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ci-artifacts

      - name: Post Consolidated PR Comment
        uses: ./.github-templates/pipelines/common/bot
        with:
          github_token: ${{ secrets.BOT_GITHUB_TOKEN || github.token }}
          mode: "plan"
          artifacts_dir: "ci-artifacts"
          environment: ${{ needs.parse-pr-metadata.outputs.env }}
          cloud_provider: ${{ inputs.cloud_provider }}
          stacks: ${{ needs.parse-pr-metadata.outputs.stacks }}

  # ===================================================================
  # CD STAGE 1 (MERGE): Sequential Terraform Apply Behind Environment Gate
  # ===================================================================
  terraform-apply:
    name: CD - Terraform Apply (${{ needs.parse-pr-metadata.outputs.env }})
    needs: [parse-pr-metadata, validate-schema]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.parse-pr-metadata.outputs.skip_ci != 'true' && needs.parse-pr-metadata.outputs.stacks != '[]' && needs.validate-schema.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ needs.parse-pr-metadata.outputs.env }}
    concurrency:
      group: tf-apply-${{ inputs.cloud_provider }}-${{ needs.parse-pr-metadata.outputs.env }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.templates_repository }}
          ref: ${{ inputs.templates_ref }}
          path: .github-templates
          fetch-depth: 1

      - name: GCP Auth
        if: inputs.cloud_provider == 'gcp'
        uses: ./.github-templates/pipelines/common/auth/gcp
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: AWS Auth
        if: inputs.cloud_provider == 'aws'
        uses: ./.github-templates/pipelines/common/auth/aws
        with:
          role_to_assume: ${{ secrets.AWS_ROLE_ARN }}
          aws_region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Azure Auth
        if: inputs.cloud_provider == 'azure'
        uses: ./.github-templates/pipelines/common/auth/azure
        with:
          client_id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Run Terraform Apply
        id: tf_apply
        uses: ./.github-templates/pipelines/continuous-provisioning/terraform-apply
        with:
          cloud_provider: ${{ inputs.cloud_provider }}
          environment: ${{ needs.parse-pr-metadata.outputs.env }}
          stacks: ${{ needs.parse-pr-metadata.outputs.stacks }}
          working_directory: ${{ inputs.working_directory }}
          config_file: ${{ needs.parse-pr-metadata.outputs.config_file }}
          state_bucket: ${{ inputs.state_bucket }}

      - name: Upload Apply Outputs Artifact
        if: always() && steps.tf_apply.outputs.report_path != ''
        uses: actions/upload-artifact@v7
        with:
          name: apply-outputs
          path: ${{ steps.tf_apply.outputs.report_path }}
          retention-days: 90
          if-no-files-found: ignore

  # ===================================================================
  # CD STAGE 2 (MERGE): Post Deployment Audit Comment on Merged PR
  # ===================================================================
  deployment-audit-bot:
    name: CD - Post Deployment Audit Comment
    needs: [parse-pr-metadata, validate-schema, terraform-apply]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.parse-pr-metadata.outputs.skip_ci != 'true' && needs.validate-schema.result == 'success' && (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.templates_repository }}
          ref: ${{ inputs.templates_ref }}
          path: .github-templates
          fetch-depth: 1

      - name: Download Apply Artifacts
        uses: actions/download-artifact@v8
        with:
          path: cd-artifacts

      - name: Post CD Deployment Audit Comment
        uses: ./.github-templates/pipelines/continuous-provisioning/deployment-audit
        with:
          github_token: ${{ secrets.BOT_GITHUB_TOKEN || github.token }}
          artifacts_dir: "cd-artifacts"
          environment: ${{ needs.parse-pr-metadata.outputs.env }}
          cloud_provider: ${{ inputs.cloud_provider }}
          state_bucket: ${{ inputs.state_bucket }}
