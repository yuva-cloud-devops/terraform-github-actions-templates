name: "GitHub Bot"
description: "Posts or updates a sticky comment on PRs or records an audit summary"
inputs:
  github_token:
    required: true
  mode:
    description: "'plan' or 'apply'"
    required: true
  summary_report_path:
    required: false
    default: ""
  plan_exit_code:
    required: false
    default: ""
  apply_status:
    required: false
    default: ""
  environment:
    required: false
    default: "dev"
  stack:
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Post or Update Sticky Comment
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        MODE: ${{ inputs.mode }}
        REPORT_PATH: ${{ inputs.summary_report_path }}
        PLAN_EXIT_CODE: ${{ inputs.plan_exit_code }}
        APPLY_STATUS: ${{ inputs.apply_status }}
        TARGET_ENV: ${{ inputs.environment }}
        STACK_NAME: ${{ inputs.stack }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.sha }}
      run: |
        SCRIPT_PATH="${{ github.action_path }}/../../../scripts/post-comment.js"
        if [ ! -f "$SCRIPT_PATH" ]; then
          SCRIPT_PATH=".github-templates/scripts/post-comment.js"
        fi
        node "$SCRIPT_PATH" || echo "::warning::Bot comment posting completed with fallback notice."
