name: "Deployment Audit"
description: "Logs deployment records and attaches audit summary to workflow and merged PR"
inputs:
  github_token:
    required: true
  report_path:
    required: false
    default: ""
  apply_status:
    required: true
  environment:
    required: false
    default: "dev"
  stack:
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Record Audit Log
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        MODE: "apply"
        REPORT_PATH: ${{ inputs.report_path }}
        APPLY_STATUS: ${{ inputs.apply_status }}
        TARGET_ENV: ${{ inputs.environment }}
        STACK_NAME: ${{ inputs.stack }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.sha }}
      run: |
        SCRIPT_PATH="${{ github.action_path }}/../../../scripts/post-comment.js"
        if [ ! -f "$SCRIPT_PATH" ]; then
          SCRIPT_PATH=".github-templates/scripts/post-comment.js"
        fi
        node "$SCRIPT_PATH" || echo "::warning::Deployment audit logging completed with fallback notice."
