name: "Deployment Audit"
description: "Generates consolidated CD Deployment Audit report and posts it to the merged PR & Actions Summary"
inputs:
  github_token:
    required: true
  artifacts_dir:
    description: "Directory containing downloaded apply artifacts"
    required: false
    default: "cd-artifacts"
  environment:
    required: false
    default: "dev"
  cloud_provider:
    required: false
    default: "gcp"
  state_bucket:
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Generate CD Audit Report & Post to Merged PR
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        MODE: "apply"
        ARTIFACTS_DIR: ${{ inputs.artifacts_dir }}
        TARGET_ENV: ${{ inputs.environment }}
        CLOUD_PROVIDER: ${{ inputs.cloud_provider }}
        STATE_BUCKET: ${{ inputs.state_bucket }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.sha }}
        RUN_ID: ${{ github.run_id }}
        EVENT_NAME: ${{ github.event_name }}
        REF_NAME: ${{ github.ref_name }}
        ACTOR: ${{ github.actor }}
      run: |
        GEN_APPLY_SCRIPT="${{ github.action_path }}/../../../scripts/generate-apply-report.js"
        [ -f "$GEN_APPLY_SCRIPT" ] || GEN_APPLY_SCRIPT=".github-templates/scripts/generate-apply-report.js"

        POST_SCRIPT="${{ github.action_path }}/../../../scripts/post-comment.js"
        [ -f "$POST_SCRIPT" ] || POST_SCRIPT=".github-templates/scripts/post-comment.js"

        FINAL_REPORT="final-apply-report.md"
        node "$GEN_APPLY_SCRIPT" \
          --artifacts "$ARTIFACTS_DIR" \
          --env "$TARGET_ENV" \
          --cloud "$CLOUD_PROVIDER" \
          --bucket "$STATE_BUCKET" \
          --sha "${COMMIT_SHA:0:7}" \
          --runid "$RUN_ID" \
          --event "$EVENT_NAME" \
          --ref "$REF_NAME" \
          --actor "$ACTOR" \
          --out "$FINAL_REPORT"

        REPORT_PATH="$FINAL_REPORT" node "$POST_SCRIPT" || echo "::warning::Deployment audit logging completed with fallback notice."
