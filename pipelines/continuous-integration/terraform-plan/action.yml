name: "Terraform Plan"
description: "Generates backend.hcl dynamically and computes Terraform plan across target stacks"
inputs:
  cloud_provider:
    required: true
  environment:
    required: true
  working_directory:
    required: false
    default: "."
  stacks:
    description: "Optional JSON array of stack directories"
    required: false
    default: "[]"
  config_file:
    description: "Optional environment config filename (e.g. compute.yaml)"
    required: false
    default: ""
  state_bucket:
    description: "Optional state bucket name override"
    required: false
    default: ""
  skip_fmt_validate:
    description: "Skip fmt and standalone validate when already executed by prior jobs"
    required: false
    default: "false"
outputs:
  exitcode:
    description: "Terraform plan exit code"
    value: ${{ steps.plan.outputs.exitcode }}
  report_path:
    description: "Path to plan artifacts directory"
    value: ${{ steps.plan.outputs.artifact_dir }}

runs:
  using: "composite"
  steps:
    - name: Generate backend.hcl, Init & Plan Across Stacks
      id: plan
      shell: bash
      env:
        CLOUD: ${{ inputs.cloud_provider }}
        ENV: ${{ inputs.environment }}
        FALLBACK_DIR: ${{ inputs.working_directory }}
        STACKS_JSON: ${{ inputs.stacks }}
        CONFIG_FILE_INPUT: ${{ inputs.config_file }}
        STATE_BUCKET_OVERRIDE: ${{ inputs.state_bucket }}
        TF_VAR_environment: ${{ inputs.environment }}
      run: |
        set +e
        ARTIFACTS_ROOT="$(pwd)/tf-plan-artifacts"
        mkdir -p "$ARTIFACTS_ROOT"

        if [ -n "$CONFIG_FILE_INPUT" ]; then
          if [ -f "${GITHUB_WORKSPACE}/environments/${ENV}/${CONFIG_FILE_INPUT}" ]; then
            export TF_VAR_config_file="${GITHUB_WORKSPACE}/environments/${ENV}/${CONFIG_FILE_INPUT}"
          fi
        fi

        TARGET_LIST=$(echo "$STACKS_JSON" | jq -r '.[]' 2>/dev/null || true)
        if [ -z "$TARGET_LIST" ]; then
          TARGET_LIST="$FALLBACK_DIR"
        fi

        OVERALL_EXIT=0
        IDX=0

        for STACK_PATH in $TARGET_LIST; do
          echo "================================================================="
          echo "Planning Stack [$IDX]: $STACK_PATH (Env: $ENV)"
          echo "================================================================="

          pushd "$STACK_PATH" >/dev/null

          if [ -z "${TF_VAR_config_file:-}" ] && [ -n "$CONFIG_FILE_INPUT" ] && [ -f "environments/${ENV}/${CONFIG_FILE_INPUT}" ]; then
            export TF_VAR_config_file="$(pwd)/environments/${ENV}/${CONFIG_FILE_INPUT}"
          fi

          if [ "$STACK_PATH" = "." ] || [ -z "$STACK_PATH" ]; then
            STACK_NAME=$(basename "$(pwd)")
          else
            STACK_NAME="${STACK_PATH#./}"
            STACK_NAME="${STACK_NAME%/}"
          fi
          AZURE_KEY=$(echo "${ENV}-${STACK_NAME}.tfstate" | tr '/' '-')

          case "$CLOUD" in
            gcp)
              BUCKET="${STATE_BUCKET_OVERRIDE:-${ENV}-tfstate-bucket}"
              cat > backend.hcl <<EOF
        bucket = "${BUCKET}"
        prefix = "${ENV}/${STACK_NAME}"
        EOF
              ;;
            aws)
              BUCKET="${STATE_BUCKET_OVERRIDE:-org-terraform-state-${ENV}}"
              cat > backend.hcl <<EOF
        bucket         = "${BUCKET}"
        key            = "${ENV}/${STACK_NAME}/terraform.tfstate"
        dynamodb_table = "tf-locks-${ENV}"
        EOF
              ;;
            azure)
              STORAGE_ACCT="${STATE_BUCKET_OVERRIDE:-sttfstate${ENV}}"
              cat > backend.hcl <<EOF
        resource_group_name  = "rg-tfstate-${ENV}"
        storage_account_name = "${STORAGE_ACCT}"
        container_name       = "tfstate"
        key                  = "${AZURE_KEY}"
        EOF
              ;;
            *)
              echo "::error::Unsupported cloud provider: $CLOUD" | tee plan.txt
              STACK_EXIT=1
              echo "{}" > tfplan.json
              ;;
          esac

          echo "=== Generated backend.hcl (${CLOUD} | ${ENV} | ${STACK_NAME}) ==="
          cat backend.hcl
          echo "================================================================="

          STACK_EXIT=0
          terraform init -input=false -reconfigure -backend-config=backend.hcl > plan.txt 2>&1
          INIT_EXIT=$?
          if [ $INIT_EXIT -ne 0 ]; then
            cat plan.txt
            echo "::error::Terraform init failed in ${STACK_PATH} with exit code $INIT_EXIT"
            STACK_EXIT=1
            echo "{}" > tfplan.json
          else
            EXTRA_ARGS=""
            if [ -f "environments/${ENV}.tfvars" ]; then
              EXTRA_ARGS="-var-file=environments/${ENV}.tfvars"
            elif [ -f "environments/${ENV}.tfvars.json" ]; then
              EXTRA_ARGS="-var-file=environments/${ENV}.tfvars.json"
            fi

            terraform plan -input=false -detailed-exitcode -no-color -out=tfplan $EXTRA_ARGS > plan.txt 2>&1
            PLAN_EXIT=$?
            cat plan.txt
            STACK_EXIT=$PLAN_EXIT

            if [ $PLAN_EXIT -eq 0 ] || [ $PLAN_EXIT -eq 2 ]; then
              terraform show -json tfplan > tfplan.json 2>/dev/null || echo "{}" > tfplan.json
            else
              echo "{}" > tfplan.json
              echo "::error::Terraform plan failed in ${STACK_PATH} with exit code $PLAN_EXIT"
            fi
          fi

          if [ "$STACK_EXIT" -eq 1 ]; then
            OVERALL_EXIT=1
          elif [ "$OVERALL_EXIT" -eq 0 ] && [ "$STACK_EXIT" -eq 2 ]; then
            OVERALL_EXIT=2
          fi

          OUT_DIR="${ARTIFACTS_ROOT}/${IDX}"
          mkdir -p "$OUT_DIR"
          cp tfplan.json "${OUT_DIR}/tfplan.json"
          cp plan.txt "${OUT_DIR}/plan.txt"
          cp backend.hcl "${OUT_DIR}/backend.hcl"
          OUT_DIR="$OUT_DIR" STACK_NAME="$STACK_NAME" STACK_PATH="$STACK_PATH" STACK_EXIT="$STACK_EXIT" node -e '
            const fs = require("fs");
            fs.writeFileSync(process.env.OUT_DIR + "/meta.json", JSON.stringify({
              stack: process.env.STACK_NAME,
              dir: process.env.STACK_PATH,
              env: process.env.ENV,
              cloud: process.env.CLOUD,
              exitcode: Number(process.env.STACK_EXIT)
            }, null, 2));
          '
          ls -la "$OUT_DIR"

          popd >/dev/null
          IDX=$((IDX + 1))
        done

        echo "exitcode=$OVERALL_EXIT" >> "$GITHUB_OUTPUT"
        echo "artifact_dir=$ARTIFACTS_ROOT" >> "$GITHUB_OUTPUT"
        set -e

        if [ "$OVERALL_EXIT" -eq 1 ]; then
          exit 1
        fi
