name: "Terraform Plan"
description: "Generates backend.hcl dynamically and computes Terraform plan with resilient error capture"
inputs:
  cloud_provider:
    required: true
  environment:
    required: true
  working_directory:
    required: false
    default: "."
  config_file:
    description: "Optional environment config filename (e.g. compute.yaml)"
    required: false
    default: ""
  state_bucket:
    description: "Optional state bucket name override"
    required: false
    default: ""
outputs:
  exitcode:
    description: "Terraform plan exit code"
    value: ${{ steps.plan.outputs.exitcode }}
  report_path:
    description: "Path to formatted markdown plan report"
    value: ${{ steps.report.outputs.report_path }}

runs:
  using: "composite"
  steps:
    - name: Terraform Format Check
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        echo "Validating Terraform formatting in ${{ inputs.working_directory }}..."
        terraform fmt -check -recursive || echo "::warning::Terraform formatting issues detected in ${{ inputs.working_directory }}. Run 'terraform fmt -recursive' to fix."

    - name: Generate backend.hcl, Init, Validate & Plan
      id: plan
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        CLOUD: ${{ inputs.cloud_provider }}
        ENV: ${{ inputs.environment }}
        STACK_PATH: ${{ inputs.working_directory }}
        CONFIG_FILE_INPUT: ${{ inputs.config_file }}
        STATE_BUCKET_OVERRIDE: ${{ inputs.state_bucket }}
        TF_VAR_environment: ${{ inputs.environment }}
      run: |
        set +e
        if [ -n "$CONFIG_FILE_INPUT" ]; then
          if [ -f "${GITHUB_WORKSPACE}/environments/${ENV}/${CONFIG_FILE_INPUT}" ]; then
            export TF_VAR_config_file="${GITHUB_WORKSPACE}/environments/${ENV}/${CONFIG_FILE_INPUT}"
          elif [ -f "environments/${ENV}/${CONFIG_FILE_INPUT}" ]; then
            export TF_VAR_config_file="$(pwd)/environments/${ENV}/${CONFIG_FILE_INPUT}"
          fi
        fi
        if [ "$STACK_PATH" = "." ] || [ -z "$STACK_PATH" ]; then
          STACK_NAME=$(basename "$(pwd)")
        else
          STACK_NAME="${STACK_PATH#./}"
          STACK_NAME="${STACK_NAME%/}"
        fi
        AZURE_KEY=$(echo "${ENV}-${STACK_NAME}.tfstate" | tr '/' '-')

        case "$CLOUD" in
          gcp)
            BUCKET="${STATE_BUCKET_OVERRIDE:-${ENV}-tfstate-bucket}"
            cat > backend.hcl <<EOF
        bucket = "${BUCKET}"
        prefix = "${ENV}/${STACK_NAME}"
        EOF
            ;;
          aws)
            BUCKET="${STATE_BUCKET_OVERRIDE:-org-terraform-state-${ENV}}"
            cat > backend.hcl <<EOF
        bucket         = "${BUCKET}"
        key            = "${ENV}/${STACK_NAME}/terraform.tfstate"
        dynamodb_table = "tf-locks-${ENV}"
        EOF
            ;;
          azure)
            STORAGE_ACCT="${STATE_BUCKET_OVERRIDE:-sttfstate${ENV}}"
            cat > backend.hcl <<EOF
        resource_group_name  = "rg-tfstate-${ENV}"
        storage_account_name = "${STORAGE_ACCT}"
        container_name       = "tfstate"
        key                  = "${AZURE_KEY}"
        EOF
            ;;
          *)
            echo "::error::Unsupported cloud provider: $CLOUD" | tee plan.txt
            echo "exitcode=1" >> "$GITHUB_OUTPUT"
            echo "{}" > tfplan.json
            exit 0
            ;;
        esac

        echo "=== Generated backend.hcl (${CLOUD} | ${ENV} | ${STACK_NAME}) ==="
        cat backend.hcl
        echo "================================================================="

        terraform init -input=false -reconfigure -backend-config=backend.hcl > plan.txt 2>&1
        INIT_EXIT=$?
        if [ $INIT_EXIT -ne 0 ]; then
          cat plan.txt
          echo "::error::Terraform init failed with exit code $INIT_EXIT"
          echo "exitcode=1" >> "$GITHUB_OUTPUT"
          echo "{}" > tfplan.json
          exit 0
        fi

        terraform validate -no-color >> plan.txt 2>&1
        VAL_EXIT=$?
        if [ $VAL_EXIT -ne 0 ]; then
          cat plan.txt
          echo "::error::Terraform validate failed with exit code $VAL_EXIT"
          echo "exitcode=1" >> "$GITHUB_OUTPUT"
          echo "{}" > tfplan.json
          exit 0
        fi

        EXTRA_ARGS=""
        if [ -f "environments/${ENV}.tfvars" ]; then
          EXTRA_ARGS="-var-file=environments/${ENV}.tfvars"
        elif [ -f "environments/${ENV}.tfvars.json" ]; then
          EXTRA_ARGS="-var-file=environments/${ENV}.tfvars.json"
        fi

        terraform plan -input=false -detailed-exitcode -no-color -out=tfplan $EXTRA_ARGS > plan.txt 2>&1
        PLAN_EXIT=$?
        cat plan.txt
        echo "exitcode=$PLAN_EXIT" >> "$GITHUB_OUTPUT"

        if [ $PLAN_EXIT -eq 0 ] || [ $PLAN_EXIT -eq 2 ]; then
          terraform show -json tfplan > tfplan.json 2>/dev/null || echo "{}" > tfplan.json
        else
          echo "{}" > tfplan.json
          echo "::error::Terraform plan failed with exit code $PLAN_EXIT"
        fi
        set -e

    - name: Generate Plan Markdown Report
      id: report
      if: always()
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        PLAN_EXIT: ${{ steps.plan.outputs.exitcode }}
        STACK_PATH: ${{ inputs.working_directory }}
      run: |
        GEN_SCRIPT="${{ github.action_path }}/../../../scripts/generate-plan-report.js"
        if [ ! -f "$GEN_SCRIPT" ]; then
          GEN_SCRIPT=".github-templates/scripts/generate-plan-report.js"
        fi

        node "$GEN_SCRIPT" \
          --json tfplan.json \
          --raw plan.txt \
          --env "${{ inputs.environment }}" \
          --cloud "${{ inputs.cloud_provider }}" \
          --stack "${STACK_PATH}" \
          --exitcode "${PLAN_EXIT:-1}" \
          --out plan-report.md

        echo "report_path=$(pwd)/plan-report.md" >> "$GITHUB_OUTPUT"

        if [ "${PLAN_EXIT:-1}" -eq 1 ]; then
          echo "::error::Failing step because Terraform init/validate/plan produced errors."
          exit 1
        fi
